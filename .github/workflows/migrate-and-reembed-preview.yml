name: DocuMind Preview Migrate & Backfill (Explicit Only)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Execution mode (dry_run is strictly read-only; execute_migration_and_backfill applies SQL migration + backfill)"
        type: choice
        required: true
        default: dry_run
        options:
          - dry_run
          - execute_migration_and_backfill
      confirm_preview_write:
        description: "Type MIGRATE_PREVIEW_NEONDB to authorize execute_migration_and_backfill (ignored in dry_run)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  preview-migrate-and-backfill:
    name: Neon Preview Migrate & Backfill (neondb)
    runs-on: ubuntu-latest
    environment: preview
    if: github.ref == 'refs/heads/preview-db-test'

    steps:
      - name: Verify target branch and explicit confirmation
        env:
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_CONFIRM_PREVIEW_WRITE: ${{ inputs.confirm_preview_write }}
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/preview-db-test" ]; then
            echo "::error::Refusing to run on branch '${GITHUB_REF_NAME}'. This workflow only targets 'preview-db-test'."
            exit 1
          fi
          if [ "${INPUT_MODE}" = "execute_migration_and_backfill" ]; then
            if [ "${INPUT_CONFIRM_PREVIEW_WRITE}" != "MIGRATE_PREVIEW_NEONDB" ]; then
              echo "::error::Missing or invalid confirm_preview_write phrase. Type MIGRATE_PREVIEW_NEONDB to execute Preview migration and backfill."
              exit 1
            fi
          elif [ "${INPUT_MODE}" != "dry_run" ]; then
            echo "::error::Unsupported mode '${INPUT_MODE}'."
            exit 1
          fi
          echo "Branch verified: ${GITHUB_REF_NAME} (mode: ${INPUT_MODE})"

      - name: Checkout preview-db-test
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Validate required Preview database secrets (no secret output)
        env:
          PREVIEW_DATABASE_URL: ${{ secrets.PREVIEW_DATABASE_URL }}
          PREVIEW_DATABASE_HOST: ${{ secrets.PREVIEW_DATABASE_HOST }}
        run: |
          missing=0
          for var in PREVIEW_DATABASE_URL PREVIEW_DATABASE_HOST; do
            val="$(printenv "$var" || true)"
            if [ -z "$val" ]; then
              echo "::error::Missing required GitHub 'preview' Environment secret: $var"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Neon Preview database secrets verified."

      - name: Run read-only migration status check (dry_run)
        if: ${{ inputs.mode == 'dry_run' }}
        env:
          TARGET_ENV: preview
          DATABASE_URL: ${{ secrets.PREVIEW_DATABASE_URL }}
          PREVIEW_DATABASE_HOST: ${{ secrets.PREVIEW_DATABASE_HOST }}
          PREVIEW_EXPECTED_DATABASE_HOST: ${{ secrets.PREVIEW_DATABASE_HOST }}
          PREVIEW_EXPECTED_DATABASE_NAME: neondb
        run: |
          npm run migrate:cloudflare -- \
            --allow-preview \
            --expected-host="${PREVIEW_DATABASE_HOST}" \
            --expected-db=neondb

      - name: Validate Cloudflare credentials for execute mode (no secret output)
        if: ${{ inputs.mode == 'execute_migration_and_backfill' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          missing=0
          for var in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN; do
            val="$(printenv "$var" || true)"
            if [ -z "$val" ]; then
              echo "::error::Missing required GitHub 'preview' Environment secret: $var"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Cloudflare Workers AI secrets verified for execute mode."

      - name: Execute explicit SQL migration and Cloudflare backfill on Neon Preview (neondb)
        if: ${{ inputs.mode == 'execute_migration_and_backfill' }}
        env:
          TARGET_ENV: preview
          DATABASE_URL: ${{ secrets.PREVIEW_DATABASE_URL }}
          PREVIEW_DATABASE_HOST: ${{ secrets.PREVIEW_DATABASE_HOST }}
          PREVIEW_EXPECTED_DATABASE_HOST: ${{ secrets.PREVIEW_DATABASE_HOST }}
          PREVIEW_EXPECTED_DATABASE_NAME: neondb
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npm run migrate:cloudflare -- \
            --execute \
            --allow-preview \
            --expected-host="${PREVIEW_DATABASE_HOST}" \
            --expected-db=neondb \
            --batch-size=5
